# Generated by scripts/generate_dashboard_example.py; edit the bundled template.
# Paste into a dedicated dashboard's Raw configuration editor.
# Entity IDs assume no area prefix; adjust them to match your entity registry.
# The integration-managed dashboard resolves entity IDs automatically.
# Integration-managed template: entity values are stable sensor keys, not entity IDs.
title: Samsung EHS
views:
  - title: Overview
    path: overview
    icon: mdi:heat-pump
    cards:
      - type: entities
        title: At a glance
        show_header_toggle: false
        entities:
          - type: custom:samsung-ehs-flow-return-row
            entity: sensor.samsung_ehs_monitor_water_flow_temperature
            return_entity: sensor.samsung_ehs_monitor_water_return_temperature
            name: Flow/Return
          - type: custom:samsung-ehs-flow-return-row
            entity: sensor.samsung_ehs_monitor_room_temperature
            return_entity: sensor.samsung_ehs_monitor_cooling_setpoint
            name: Indoor actual/requested
            icon: mdi:home-thermometer
          - entity: sensor.samsung_ehs_monitor_outdoor_temperature
            name: Outdoors
            icon: mdi:thermometer
          - entity: sensor.samsung_ehs_monitor_water_flow_rate
            name: Water flow
            icon: mdi:waves-arrow-right
          - entity: sensor.samsung_ehs_monitor_estimated_thermal_output
            name: Estimated heat
            icon: mdi:heat-wave
          - type: custom:samsung-ehs-compressor-row
            entity: sensor.samsung_ehs_monitor_compressor_frequency
            discharge_entity: sensor.samsung_ehs_monitor_discharge_gas_temperature
            pump_entity: sensor.samsung_ehs_monitor_circulation_pump_speed
            name: Compressor
          - entity: sensor.samsung_ehs_monitor_electrical_energy
            name: Electrical energy (reported counter)
          - entity: sensor.samsung_ehs_monitor_electrical_energy_difference
            name: Electrical energy difference (reported)
      - type: entities
        title: Estimated performance
        show_header_toggle: false
        entities:
          - type: custom:samsung-ehs-performance-row
            metric: power
            entity: sensor.samsung_ehs_monitor_electrical_input_power
            return_entity: sensor.samsung_ehs_monitor_electrical_energy_today
            name: Power instant/day total
          - type: custom:samsung-ehs-performance-row
            metric: heat
            entity: sensor.samsung_ehs_monitor_net_thermal_power
            return_entity: sensor.samsung_ehs_monitor_estimated_heat_energy_today
            name: Heat instant/day total
          - type: custom:samsung-ehs-performance-row
            metric: cop
            entity: sensor.samsung_ehs_monitor_estimated_cop
            return_entity: sensor.samsung_ehs_monitor_estimated_cop_today
            name: COP instant/day
      - type: custom:samsung-ehs-weather-curve-card
        title: Weather compensation · water law
        entities:
          - entity: sensor.samsung_ehs_monitor_fsv_2011
            role: outdoor_cold
          - entity: sensor.samsung_ehs_monitor_fsv_2012
            role: outdoor_warm
          - entity: sensor.samsung_ehs_monitor_fsv_2021
            role: wl1_cold
          - entity: sensor.samsung_ehs_monitor_fsv_2022
            role: wl1_warm
          - entity: sensor.samsung_ehs_monitor_fsv_2031
            role: wl2_cold
          - entity: sensor.samsung_ehs_monitor_fsv_2032
            role: wl2_warm
          - entity: sensor.samsung_ehs_monitor_fsv_2041
            role: selected
          - entity: sensor.samsung_ehs_monitor_outdoor_temperature
            role: outdoor
          - entity: sensor.samsung_ehs_monitor_water_flow_temperature
            role: actual_flow
      - type: custom:samsung-ehs-daily-cop-card
        title: Daily estimated COP
        entity: sensor.samsung_ehs_monitor_estimated_cop_today
        days_to_show: 14
      - type: entities
        title: Last 7 days · available matched data
        show_header_toggle: false
        entities:
          - entity: sensor.samsung_ehs_monitor_estimated_heat_energy_7d
            name: Estimated heat produced
          - entity: sensor.samsung_ehs_monitor_electrical_energy_7d
            name: Electricity consumed
          - entity: sensor.samsung_ehs_monitor_estimated_cop_7d
            name: Estimated 7-day COP
      - type: history-graph
        title: Temperatures 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.samsung_ehs_monitor_water_flow_temperature
            name: Flow / outlet
          - entity: sensor.samsung_ehs_monitor_water_return_temperature
            name: Return / inlet
          - entity: sensor.samsung_ehs_monitor_outdoor_temperature
            name: Outdoor
          - entity: sensor.samsung_ehs_monitor_room_temperature
            name: Indoor
          - entity: sensor.samsung_ehs_monitor_cooling_setpoint
            name: Target
          - entity: sensor.samsung_ehs_monitor_discharge_gas_temperature
            name: Compressor discharge gas
      - type: history-graph
        title: Estimated heat output · 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.samsung_ehs_monitor_estimated_thermal_output
            name: Estimated thermal output
  - title: Trends
    path: trends
    icon: mdi:chart-bar
    cards:
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Electrical input and estimated heat · today, hourly averages
        period: day
        entities:
          - entity: sensor.samsung_ehs_monitor_electrical_input_power_kw
            name: Electrical input · kW
          - entity: sensor.samsung_ehs_monitor_estimated_thermal_output
            name: Estimated heat output · kW
      - type: custom:samsung-ehs-history-bar-card
        stacked: false
        title: Outdoor, discharge gas and indoor temperatures · today, hourly averages
        period: day
        entities:
          - entity: sensor.samsung_ehs_monitor_outdoor_temperature
            name: Outdoors
          - entity: sensor.samsung_ehs_monitor_discharge_gas_temperature
            name: Discharge gas
          - entity: sensor.samsung_ehs_monitor_room_temperature
            name: Indoors
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Water flow · today, hourly averages
        period: day
        entities:
          - entity: sensor.samsung_ehs_monitor_water_flow_rate
            name: Flow rate
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Compressor frequency · today, hourly averages
        period: day
        entities:
          - entity: sensor.samsung_ehs_monitor_compressor_frequency
            name: Actual
          - entity: sensor.samsung_ehs_monitor_compressor_target_frequency
            name: Target
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Pump speed · today, hourly averages
        period: day
        entities:
          - entity: sensor.samsung_ehs_monitor_circulation_pump_speed
            name: Pump speed
  - title: Logs
    path: logs
    icon: mdi:alert-circle-outline
    cards:
      - type: markdown
        title: API and parsing failures
        content: |
          {% set log = 'sensor.samsung_ehs_monitor_failure_log' %}
          {% set entries = state_attr(log, 'entries') or [] %}
          {% if states(log) in ['unknown', 'unavailable'] %}
          Log sensor unavailable. Check that the integration is loaded and the failure log sensor is enabled.
          {% elif not entries %}
          No failures recorded since the integration was loaded.
          {% else %}
          | Last seen (UTC) | First seen (UTC) | Count | Source | Failure |
          | --- | --- | --- | --- | --- |
          {% for entry in entries -%}
          | {{ entry.last_seen }} | {{ entry.first_seen }} | {{ entry.count }} | {{ entry.category }} | {{ entry.message | replace('|', '/') | replace('\n', ' ') }} |
          {% endfor %}
          {% endif %}

          Latest 100 distinct failures. Repeated failures are grouped. Cleared on restart or integration reload.
