# Integration-managed template: entity values are stable sensor keys, not entity IDs.
title: Samsung EHS
views:
  - title: Overview
    path: overview
    icon: mdi:heat-pump
    cards:
      - type: entities
        title: At a glance
        show_header_toggle: false
        entities:
          - type: custom:samsung-ehs-flow-return-row
            entity: water_flow_temperature
            return_entity: water_return_temperature
            name: Flow/Return
          - type: custom:samsung-ehs-flow-return-row
            entity: room_temperature
            return_entity: cooling_setpoint
            name: Indoor actual/requested
            icon: mdi:home-thermometer
          - entity: outdoor_temperature
            name: Outdoors
            icon: mdi:thermometer
          - entity: water_flow_rate
            name: Water flow
            icon: mdi:waves-arrow-right
          - entity: thermal_power
            name: Estimated heat
            icon: mdi:heat-wave
          - type: custom:samsung-ehs-compressor-row
            entity: compressor_frequency
            discharge_entity: discharge_temperature
            pump_entity: circulation_pump_speed
            name: Compressor
          - entity: energy
            name: Electrical energy (reported counter)
          - entity: deltaEnergy
            name: Electrical energy difference (reported)
      - type: entities
        title: Estimated performance
        show_header_toggle: false
        entities:
          - type: custom:samsung-ehs-performance-row
            metric: power
            entity: electrical_input_power
            return_entity: electrical_energy_today
            week_entity: electrical_energy_7d
            name: Electricity instant/day/7 day
          - type: custom:samsung-ehs-performance-row
            metric: heat
            entity: net_thermal_power
            return_entity: estimated_heat_energy_today
            week_entity: estimated_heat_energy_7d
            name: Heat instant/day/7 day
          - type: custom:samsung-ehs-performance-row
            metric: cop
            entity: estimated_cop
            return_entity: estimated_cop_today
            week_entity: estimated_cop_7d
            name: COP instant/day/7 day
      - type: custom:samsung-ehs-weather-curve-card
        title: Weather compensation · water law
        entities:
          - entity: fsv_2011
            role: outdoor_cold
          - entity: fsv_2012
            role: outdoor_warm
          - entity: fsv_2021
            role: wl1_cold
          - entity: fsv_2022
            role: wl1_warm
          - entity: fsv_2031
            role: wl2_cold
          - entity: fsv_2032
            role: wl2_warm
          - entity: fsv_2041
            role: selected
          - entity: outdoor_temperature
            role: outdoor
          - entity: water_flow_temperature
            role: actual_flow
      - type: custom:samsung-ehs-daily-cop-card
        title: Daily estimated COP
        entity: estimated_cop_today
        days_to_show: 14
      - type: history-graph
        title: Temperatures 24 hours
        hours_to_show: 24
        entities:
          - entity: water_flow_temperature
            name: Flow / outlet
          - entity: water_return_temperature
            name: Return / inlet
          - entity: outdoor_temperature
            name: Outdoor
          - entity: room_temperature
            name: Indoor
          - entity: cooling_setpoint
            name: Target
          - entity: discharge_temperature
            name: Compressor discharge gas
      - type: history-graph
        title: Estimated heat output · 24 hours
        hours_to_show: 24
        entities:
          - entity: thermal_power
            name: Estimated thermal output
  - title: Trends
    path: trends
    icon: mdi:chart-bar
    cards:
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Electrical input and estimated heat · today, hourly averages
        period: day
        entities:
          - entity: electrical_input_power_kw
            name: Electrical input · kW
          - entity: thermal_power
            name: Estimated heat output · kW
      - type: custom:samsung-ehs-history-bar-card
        stacked: false
        overlay: true
        title: Outdoor and indoor temperatures · today, hourly averages
        period: day
        entities:
          - entity: outdoor_temperature
            name: Outdoors
          - entity: room_temperature
            name: Indoors
      - type: custom:samsung-ehs-history-bar-card
        stacked: false
        overlay: true
        title: Flow and discharge gas temperatures · today, hourly averages
        period: day
        entities:
          - entity: water_flow_temperature
            name: Flow
          - entity: discharge_temperature
            name: Discharge gas
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Water flow · today, hourly averages
        period: day
        entities:
          - entity: water_flow_rate
            name: Flow rate
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Compressor frequency · today, hourly averages
        period: day
        entities:
          - entity: compressor_frequency
            name: Actual
          - entity: compressor_target_frequency
            name: Target
      - type: custom:samsung-ehs-history-bar-card
        stacked: true
        title: Pump speed · today, hourly averages
        period: day
        entities:
          - entity: circulation_pump_speed
            name: Pump speed
  - title: AI
    path: ai
    icon: mdi:robot-outline
    cards:
      - type: custom:samsung-ehs-ai-export-card
        entity: estimated_cop_today
  - title: Logs
    path: logs
    icon: mdi:alert-circle-outline
    cards:
      - type: markdown
        title: API and parsing failures
        content: |
          {% set log = '__FAILURE_LOG_ENTITY__' %}
          {% set entries = state_attr(log, 'entries') or [] %}
          {% if states(log) in ['unknown', 'unavailable'] %}
          Log sensor unavailable. Check that the integration is loaded and the failure log sensor is enabled.
          {% elif not entries %}
          No failures recorded since the integration was loaded.
          {% else %}
          | Last seen (UTC) | First seen (UTC) | Count | Source | Failure |
          | --- | --- | --- | --- | --- |
          {% for entry in entries -%}
          | {{ entry.last_seen }} | {{ entry.first_seen }} | {{ entry.count }} | {{ entry.category }} | {{ entry.message | replace('|', '/') | replace('\n', ' ') }} |
          {% endfor %}
          {% endif %}

          Latest 100 distinct failures. Repeated failures are grouped. Cleared on restart or integration reload.
