# Integration-managed template: entity values are stable sensor keys, not entity IDs.
title: Samsung EHS
views:
  - title: Overview
    path: overview
    icon: mdi:heat-pump
    cards:
      - type: entities
        title: At a glance
        show_header_toggle: false
        entities:
          - type: custom:samsung-ehs-flow-return-row
            entity: water_flow_temperature
            return_entity: water_return_temperature
            name: Flow/Return
          - type: custom:samsung-ehs-flow-return-row
            entity: room_temperature
            return_entity: cooling_setpoint
            name: Indoor actual/requested
            icon: mdi:home-thermometer
          - entity: outdoor_temperature
            name: Outdoors
            icon: mdi:thermometer
          - entity: water_flow_rate
            name: Water flow
            icon: mdi:waves-arrow-right
          - entity: thermal_power
            name: Estimated heat
            icon: mdi:heat-wave
          - entity: compressor_frequency
            name: Compressor
            icon: mdi:sine-wave
          - entity: energy
            name: Electrical energy (reported counter)
          - entity: deltaEnergy
            name: Electrical energy difference (reported)
      - type: entities
        title: Estimated performance
        show_header_toggle: false
        entities:
          - entity: electrical_input_power
            name: Electrical input power · selected source
            icon: mdi:flash
          - entity: estimated_cop
            name: Estimated live COP
            icon: mdi:heat-pump
          - entity: net_thermal_power
            name: Net heat flow · includes defrost
      - type: entities
        title: Today · external power sensor
        show_header_toggle: false
        entities:
          - entity: estimated_heat_energy_today
            name: Estimated heat energy today
          - entity: electrical_energy_today
            name: Measured electricity today · valid paired intervals
          - entity: estimated_cop_today
            name: Estimated COP today
          - entity: daily_performance_coverage
            name: Coverage of elapsed day
      - type: custom:samsung-ehs-daily-cop-card
        title: Daily estimated COP
        entity: estimated_cop_today
        days_to_show: 14
      - type: entities
        title: Last 7 days · matched energy window
        show_header_toggle: false
        entities:
          - entity: estimated_heat_energy_7d
            name: Estimated heat produced
          - entity: electrical_energy_7d
            name: Electricity consumed
          - entity: estimated_cop_7d
            name: Estimated 7-day COP
      - type: entities
        title: Compressor and circulation
        show_header_toggle: false
        entities:
          - entity: circulation_pump_speed
            name: Circulation pump speed
            icon: mdi:pump
          - entity: compressor_frequency
            name: Compressor actual frequency
          - entity: compressor_target_frequency
            name: Compressor target frequency
          - entity: discharge_temperature
            name: Discharge gas temperature
      - type: history-graph
        title: Water temperatures · 24 hours
        hours_to_show: 24
        entities:
          - entity: water_flow_temperature
            name: Flow / outlet
          - entity: water_return_temperature
            name: Return / inlet
      - type: history-graph
        title: Estimated heat output · 24 hours
        hours_to_show: 24
        entities:
          - entity: thermal_power
            name: Estimated thermal output
  - title: Trends
    path: trends
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: Outdoor temperature · 24 hours
        hours_to_show: 24
        entities:
          - entity: outdoor_temperature
            name: Outdoors
      - type: history-graph
        title: Water flow · 24 hours
        hours_to_show: 24
        entities:
          - entity: water_flow_rate
            name: Flow rate
      - type: history-graph
        title: Compressor frequency · 24 hours
        hours_to_show: 24
        entities:
          - entity: compressor_frequency
            name: Actual
          - entity: compressor_target_frequency
            name: Target
      - type: history-graph
        title: Pump speed · 24 hours
        hours_to_show: 24
        entities:
          - entity: circulation_pump_speed
            name: Pump speed
      - type: history-graph
        title: Discharge gas temperature · 24 hours
        hours_to_show: 24
        entities:
          - entity: discharge_temperature
            name: Discharge gas
